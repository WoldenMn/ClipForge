  <rect x="338" y="202" width="348" height="628" rx="52" fill="none" stroke="#fef3c7" stroke-opacity="0.35" stroke-width="4"/>

  <path d="M468 446 L468 590 L586 518 Z" fill="#1a1203" stroke="#1a1203" stroke-width="34" stroke-linejoin="round"/>

