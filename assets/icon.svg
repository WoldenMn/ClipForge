  <rect x="67" y="67" width="890" height="890" rx="193" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>

  <rect x="150" y="318" width="724" height="408" rx="44" fill="#1c1813" stroke="#6b6156" stroke-width="20"/>

