<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>ClipForge</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 14px;
             background: #0a0a0a; color: #e5e5e5;
             font-family: "Segoe UI", system-ui, sans-serif; }
      h1 { margin: 0; font-size: 22px; color: #fbbf24; letter-spacing: .5px; }
      p { margin: 0; font-size: 13px; color: #a3a3a3; text-align: center;
          max-width: 400px; line-height: 1.5; }
      .bar { width: 220px; height: 3px; background: #262626; border-radius: 2px;
             overflow: hidden; }
      .bar span { display: block; height: 100%; width: 40%; background: #f59e0b;
                  animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-120%) } 100% { transform: translateX(320%) } }
      .err { color: #fca5a5; white-space: pre-wrap; font-size: 11px;
             max-height: 90px; overflow: auto; text-align: left; }
    </style>
  </head>
  <body>
    <h1>ClipForge</h1>
    <div class="bar" id="bar"><span></span></div>
    <p id="msg">Demarrage du moteur...</p>
    <script type="module">
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      let affiche = false;

      function afficherErreur(detail) {
        if (affiche) return;
        affiche = true;
        document.getElementById("bar").style.display = "none";
        document.getElementById("msg").textContent = "ClipForge n'a pas pu demarrer.";
        const pre = document.createElement("p");
        pre.className = "err";
        pre.textContent = detail || "";
        document.body.appendChild(pre);
      }

      // ecouteur d'abord, etat ensuite : l'inverse laisse un intervalle ou une
      // erreur n'est ni dans le retour de invoke ni encore ecoutee.
      await listen("engine-status", (e) => {
        const { state, detail } = e.payload;
        if (state === "error") afficherErreur(detail);
      });

      const dejaEnErreur = await invoke("engine_status");
      if (dejaEnErreur) afficherErreur(dejaEnErreur);
    </script>
  </body>
</html>
